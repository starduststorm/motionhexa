; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = v7

[env]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.filesystem_size = 0.5m
board = rpipico
lib_deps = 
  FastLED/FastLED@3.10.2
; board_build.arduino.earlephilhower.usb_vid = 0x2E8A ; rpi
; board_build.arduino.earlephilhower.usb_pid = 0x000A ; pico
board_build.arduino.earlephilhower.usb_manufacturer = "starduststorm"
board_build.arduino.earlephilhower.usb_product = "motionhexa"
; fix for memcpy_P->memcpy include issue between framework-arduinopico and SparkFun ICM 20948
extra_scripts = pre:scripts/inject_string_h.py

[env:v5]  # MakerFaire 2025 hardware
build_flags = -DHARDWARE_VERSION=5 -std=c++17 -DICM_20948_USE_DMP  -DKISSFFT_DATATYPE=int16_t -DFIXED_POINT=1
lib_deps = 
  ${env.lib_deps}
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0

[env:v6]
build_flags = -DHARDWARE_VERSION=6 -std=c++17 -DICM_20948_USE_DMP -DKISSFFT_DATATYPE=int16_t -DFIXED_POINT=1
lib_deps =
  ${env.lib_deps}
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0

[env:v7]  # covers v8 (differentiate by flash JEDEC ID) too - unified pcb: RP2350, LY4176D, BQ27427YZFR, BMI270 (SPI) + MMC5603NJ (I2C)
board = rpipico2
board_upload.maximum_size = 2097152
build_flags = -DHARDWARE_VERSION=7 -std=c++17 -DKISSFFT_DATATYPE=int16_t -DFIXED_POINT=1
lib_deps = 
  ${env.lib_deps}
  sparkfun/SparkFun BMI270 Arduino Library@^1.0.3
  adafruit/Adafruit MMC56x3@^1.0.2

[env:mini_v2]  # 127x WS2812B, row-major
build_flags = -std=c++17 -DMINI_VERSION=2 -DKISSFFT_DATATYPE=int16_t -DFIXED_POINT=1
